<text x="960" y="650" class="t">Vorschlag v1 · Gäste-WC am Hintereingang → WC + Garderobe</text>
<text x="960" y="676" class="s">„Gang“ = Flur 3,7 m² am Hintereingang; Blick nach Süden: links Garderobe, rechts WC.</text>
<text x="960" y="698" class="s">Trennwand neu 10 cm (Ständerwand, WC-Seite gefliest), bündig mit der Laibung der</text>
<text x="960" y="720" class="s">bestehenden Türöffnung (80) – die bleibt als Zugang zur Garderobe.</text>
<text x="960" y="742" class="s">WC-Tür neu: Durchbruch 76 (Rohbau), schlägt nach außen; Band an der Trennwand-</text>
<text x="960" y="764" class="s">seite, so kommt sie der Hintertür nicht in die Quere.</text>
<text x="960" y="786" class="s">Tiefe 110 bleibt, WC an der Südwand wie im Plan. Ein Stand-WC wie Mallnitz (69 tief)</text>
<text x="960" y="808" class="s">lässt 41 bis zur Wand, ≈ 55 bis zum Türblatt – darum schlägt die Tür nach außen auf.</text>
<text x="960" y="830" class="s">Wand-WC mit Vorwand (≈ 55–60 tief) gäbe ≈ 10 cm mehr.</text>
<text x="960" y="852" class="s">WC wie Mallnitz: Stand-WC mit Spülkasten, Handwaschbecken 40/28 auf Konsole,</text>
<text x="960" y="874" class="s">Metrofliesen mit Abschlussleiste bis ≈ 112.</text>
<text x="960" y="896" class="s">Garderobe wie Mallnitz: Bank 35 tief an der Ostwand (links), Hakenbrett, Hutablage.</text>
