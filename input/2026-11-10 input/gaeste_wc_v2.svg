<text x="960" y="650" class="t">Variante v2 · WC-Wand +5 cm, Handwaschbecken im Flur</text>
<text x="960" y="676" class="s">WC-Nordwand ist Bestand (15 cm, grau im Plan; im OG steht keine Wand darüber).</text>
<text x="960" y="698" class="s">5 cm „raus“ = Abbruch + neue Wand 15 cm: Tiefe WC/Garderobe 110 → 115;</text>
<text x="960" y="720" class="s">Wandstück Flur bis zur Hintertür 69 → 64. Statik der Wand vorher klären.</text>
<text x="960" y="742" class="s2">Alternative: neue 10-cm-Ständerwand, Flurseite bleibt, wo sie ist → ebenfalls +5, Flur unverändert.</text>
<text x="960" y="764" class="s">HWB 40/28 an der Flur-Ostwand rechts neben der Windfangtür (Wandstück 64),</text>
<text x="960" y="786" class="s">Spiegel darüber; zwischen offener WC-Tür und Becken 83 frei.</text>
<text x="960" y="808" class="s">WC ohne Becken: Stand-WC 69 tief, 46 bis zur Wand; Türöffnung ohne Engstelle.</text>
<text x="960" y="830" class="s">Garderobe wie v1: Bank 35 an der Ostwand, 59 frei; Tiefe jetzt 115.</text>
<text x="960" y="852" class="s2">Alternative: Bank an der Rückwand (94 lang), davor 80 frei.</text>
<text x="960" y="874" class="q">Garderobe ohne Tür: eine Tür nach außen schlüge gegen das Becken.</text>
<text x="960" y="896" class="q">Offen: Zu-/Abwasser zum HWB – vom WC her im Boden unter der Garderobe?</text>
<text x="960" y="918" class="q">Windfangtür: Becken frei, ob sie in den Gang (Plan) oder in den Flur (3D-Modell,</text>
<text x="960" y="940" class="q">Band Nord) aufschlägt.</text>
