<text x="30" y="930" class="t">Schrankbett v1 · 2 × 2 m Klappbett im Yoga-Zimmer (OG), Schrankwand an der Südwand</text>
<text x="30" y="958" class="s">Von der Westwand bis zur Yoga-Tür 278 breit: Schrank 36, Nische 206 (Bett 204 + je 1), Schrank 36; Tiefe 45 bis Türfront.</text>
<text x="30" y="980" class="s">Bett 204 × 204, Liegefläche 200 × 200, Liegehöhe 39; ausgeklappt 221 ab Wand (Kopfende 17).</text>
<text x="30" y="1002" class="s">Drehachse 20 vom Kopfende, 8 über der Unterseite (24 über Boden); hochgeklappt bündig mit den Türfronten, OK 208.</text>
<text x="30" y="1024" class="s">Höchster Punkt des Schwenks 2,08 (Seitenschiene, Fußende) unter der Blende ab 2,10; Blende bis 2,197, Decke 2,20.</text>
<text x="30" y="1046" class="q">Der linke Schrank verdeckt einen Teil der Fensterlaibung (abgesprochen). Fichte wie die übrigen OG-Möbel (angenommen).</text>
<text x="30" y="1068" class="q">Nicht maßstäblich; Maße in cm. Füße stehen hochgeklappt 15 über die Türfront (real: an die Unterseite geklappt).</text>
