<text x="1085" y="170" class="h3">Speis, von der Flurwand nach Süden:</text>
<text x="1085" y="196" class="s">A  Regal offen, 60 tief, bis zur Decke</text>
<text x="1085" y="217" class="s">    Gang 91,9, Westende frei</text>
