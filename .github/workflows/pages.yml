# Builds the .glb and the plan sheets from the Python core and the three.js viewer, and publishes
# web/dist on GitHub Pages (https://tillg.github.io/frechen_blender/). One-time repo setting: Pages source
# "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read          # npm ci runs third-party install scripts: no write tokens in build

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: python3 code/export_plans.py plans/   # fresh plan sheets; npm run blueprint copies them to dist/plans/
      - run: npm run build          # prebuild: python3 ../code/export_gltf.py public/frechenlehen.glb
        working-directory: web
      - run: cp "$(python3 code/film_release.py latest .)" web/dist/rundgang.mp4   # the newest film, playable in the browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
